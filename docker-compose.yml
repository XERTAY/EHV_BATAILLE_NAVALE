version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: battleship-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SERVER_PORT=8080
    volumes:
      - backend-data:/app/data
    networks:
      - battleship-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: battleship-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - battleship-network
    restart: unless-stopped

volumes:
  backend-data:

networks:
  battleship-network:
    driver: bridge

